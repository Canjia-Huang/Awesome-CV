name: Compile CV

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Build TeX environment
      run: docker build --tag awesome-cv .

    - name: Compile cv.pdf
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          --volume "$PWD:/doc" awesome-cv make pdf

    - name: Upload cv.pdf
      uses: actions/upload-artifact@v7
      with:
        name: cv
        path: build/cv.pdf
        if-no-files-found: error
