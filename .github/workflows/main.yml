name: Compile CV

on:
  push:
    branches: [master]
    paths:
      - "cv.tex"
      - "sections/**"
      - "assets/**"
      - "awesome-cv.cls"
      - "latexmkrc"
      - "luaotfload.conf"
      - "Dockerfile"
      - ".github/workflows/main.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# A new push cancels the run that is still building the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Build TeX environment
      run: docker build --tag awesome-cv .

    - name: Compile cv.pdf
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          --volume "$PWD:/doc" awesome-cv make pdf

    - name: Upload cv.pdf
      uses: actions/upload-artifact@v7
      with:
        name: cv
        path: build/cv.pdf
        if-no-files-found: error
